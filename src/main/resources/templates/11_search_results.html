<!DOCTYPE html>
<!--Talha Arif - r1066207-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Search Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>
<body>
<div th:if="${results.isEmpty()}">
    <h2 th:text="'There is no maintenance with the name \'' + ${searchType} + '\''"></h2>
</div>

<div th:unless="${results.isEmpty()}">
    <h2>We found the following maintenances:</h2>
    <ul>
        <li th:each="m : ${results}"
            th:text="${m.getType() + ' — Duration ' + m.getDuration() + ' minutes, hourly rate ' + m.getHourlyRate()}">
        </li>
    </ul>
</div>

<a href="/index">Back to home</a>
</body>
</html>
